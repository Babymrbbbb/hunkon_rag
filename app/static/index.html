<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>演示品牌 · RAG 知识助手</title>
<style>
  :root{
    --bg:#0c0c0e; --panel:#16161a; --panel2:#1d1d22;
    --gold:#d4af37; --gold-soft:#e8c862; --line:#2a2a30;
    --text:#f2f2f2; --muted:#9a9aa3; --user:#2a2418; --bot:#1a1a1f;
    --ok:#4ade80; --bad:#f87171;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:radial-gradient(1200px 600px at 50% -10%, #1a1712 0%, var(--bg) 60%);
    color:var(--text); font-family:-apple-system,"PingFang SC","Microsoft YaHei",Segoe UI,sans-serif;
    display:flex; flex-direction:column; height:100vh;
  }
  header{
    padding:14px 20px; border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:12px;
    background:linear-gradient(180deg,#14110b,#0c0c0e);
  }
  .logo{
    width:34px;height:34px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--gold-soft), var(--gold) 60%, #8a6d1f);
    box-shadow:0 0 14px rgba(212,175,55,.45);
  }
  header h1{font-size:16px;font-weight:700;letter-spacing:.5px}
  header h1 span{color:var(--gold)}
  header .sub{font-size:12px;color:var(--muted);margin-left:auto;display:flex;align-items:center;gap:8px}
  header .actions{display:flex;gap:8px}
  header .icon-btn{
    background:var(--panel);border:1px solid var(--line);color:var(--muted);
    border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer;transition:.15s;
  }
  header .icon-btn:hover{color:var(--gold);border-color:var(--gold)}
  .wrap{flex:1;display:flex;flex-direction:column;max-width:820px;width:100%;margin:0 auto;padding:16px}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .chip{font-size:12.5px;color:var(--gold-soft);border:1px solid var(--line);background:var(--panel);
    padding:6px 11px;border-radius:999px;cursor:pointer;transition:.15s}
  .chip:hover{background:var(--panel2);border-color:var(--gold)}
  #log{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding:6px 2px}
  .msg{display:flex;gap:10px;align-items:flex-start}
  .msg .av{width:30px;height:30px;border-radius:8px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
  .user .av{background:var(--gold);color:#1a1407}
  .bot .av{background:#26262d;color:var(--gold)}
  .bubble{padding:11px 14px;border-radius:12px;line-height:1.65;font-size:14.5px;max-width:660px;white-space:pre-wrap;word-break:break-word}
  .user .bubble{background:var(--user);border:1px solid #3a3120}
  .bot .bubble{background:var(--bot);border:1px solid var(--line)}
  .cites{margin-top:8px;font-size:12px;color:var(--muted);border-top:1px dashed var(--line);padding-top:6px}
  .cites b{color:var(--gold-soft)}
  .meta{font-size:11px;color:var(--muted);margin-top:4px}
  .fb{margin-top:8px;display:flex;gap:6px;align-items:center}
  .fb button{
    background:var(--panel);border:1px solid var(--line);color:var(--muted);
    border-radius:6px;padding:3px 9px;font-size:12px;cursor:pointer;transition:.15s;
  }
  .fb button:hover{border-color:var(--gold);color:var(--gold)}
  .fb button.on-up{color:var(--ok);border-color:var(--ok)}
  .fb button.on-down{color:var(--bad);border-color:var(--bad)}
  .fb .fb-msg{font-size:11px;color:var(--muted)}
  .typing{color:var(--muted);font-size:13px;font-style:italic}
  .typing-dot{display:inline-block;animation:blink 1.4s infinite both}
  .typing-dot:nth-child(2){animation-delay:.2s}
  .typing-dot:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
  .inputbar{display:flex;gap:10px;padding-top:10px;border-top:1px solid var(--line)}
  textarea{flex:1;resize:none;height:46px;background:var(--panel);color:var(--text);
    border:1px solid var(--line);border-radius:10px;padding:11px 13px;font-size:14.5px;font-family:inherit;outline:none}
  textarea:focus{border-color:var(--gold)}
  button.send{background:linear-gradient(180deg,var(--gold-soft),var(--gold));color:#1a1407;border:none;
    border-radius:10px;padding:0 20px;font-weight:700;cursor:pointer;font-size:14px}
  button.send:disabled{opacity:.5;cursor:default}
  .err{color:var(--bad);font-size:13px}
</style>
</head>
<body>
  <header>
    <div class="logo"></div>
    <h1>演示品牌 · <span>RAG 知识助手</span></h1>
    <div class="sub">
      <span id="model-label">检索增强生成</span>
      <div class="actions">
        <button class="icon-btn" id="clearBtn" title="清空对话">清空</button>
      </div>
    </div>
  </header>

  <div class="wrap">
    <div class="chips" id="chips">
      <div class="chip">演示品牌 是哪个城市的品牌？</div>
      <div class="chip">2026 夏季推出了哪几款新品？</div>
      <div class="chip">目前有多少家门店？</div>
      <div class="chip">竞品竞品甲的干货类产品有哪些？</div>
    </div>
    <div id="log"></div>
    <div class="inputbar">
      <textarea id="q" placeholder="输入你关于演示品牌 的问题，回车发送…"></textarea>
      <button class="send" id="send">发送</button>
    </div>
  </div>

<script>
const API_KEY = "dev-secret-key";
const log = document.getElementById("log");
const q = document.getElementById("q");
const sendBtn = document.getElementById("send");

// ---------- 多轮历史（localStorage） ----------
const HISTORY_KEY = "hunkon_rag_history";
let history = [];
try{ history = JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]"); }catch(e){ history = []; }

function saveHistory(){
  try{ localStorage.setItem(HISTORY_KEY, JSON.stringify(history.slice(-50))); }catch(e){}
}

function addMsg(role, html, opts){
  opts = opts || {};
  const m = document.createElement("div");
  m.className = "msg " + role;
  const av = role === "user" ? "我" : "AI";
  let inner = `<div class="av">${av}</div><div style="flex:1;min-width:0">`;
  inner += `<div class="bubble">${html}</div>`;
  if(opts.cites && opts.cites.length){
    inner += `<div class="cites">📚 参考来源：<b>${opts.cites.map(c=>c.title).join("、")}</b></div>`;
  }
  if(opts.meta) inner += `<div class="meta">${opts.meta}</div>`;
  // 反馈按钮（仅 bot 消息）
  if(role === "bot" && opts.cites){
    inner += `<div class="fb" data-q="${encodeURIComponent(opts.question || "")}" data-a="${encodeURIComponent(opts.answer || "")}" data-cites="${encodeURIComponent(JSON.stringify(opts.cites||[]))}">`;
    inner += `<button class="fb-up" title="回答有用">👍 有用</button>`;
    inner += `<button class="fb-down" title="回答有误">👎 有误</button>`;
    inner += `<span class="fb-msg"></span></div>`;
  }
  inner += `</div>`;
  m.innerHTML = inner;
  log.appendChild(m);
  log.scrollTop = log.scrollHeight;
  return m;
}

function escapeHtml(s){return (s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}

// ---------- 反馈提交 ----------
async function sendFeedback(qText, answer, cites, rating){
  const res = await fetch("/api/feedback", {
    method:"POST",
    headers:{"Content-Type":"application/json","X-API-Key":API_KEY},
    body: JSON.stringify({question:qText, answer:answer, citations:cites, rating:rating})
  });
  return res.ok;
}

// 事件委托：处理反馈按钮
log.addEventListener("click", async e=>{
  const up = e.target.closest(".fb-up");
  const down = e.target.closest(".fb-down");
  if(!up && !down) return;
  const fb = e.target.closest(".fb");
  const qText = decodeURIComponent(fb.dataset.q || "");
  const answer = decodeURIComponent(fb.dataset.a || "");
  let cites = [];
  try{ cites = JSON.parse(decodeURIComponent(fb.dataset.cites || "[]")); }catch(err){}
  const rating = up ? 1 : -1;
  const msgEl = fb.querySelector(".fb-msg");
  try{
    const ok = await sendFeedback(qText, answer, cites, rating);
    msgEl.textContent = ok ? (rating===1 ? "已记录 👍" : "已记录 👎") : "提交失败";
    if(ok){ up && up.classList.add("on-up"); down && down.classList.add("on-down"); }
  }catch(err){
    msgEl.textContent = "提交失败";
  }
});

// ---------- 发送问题 ----------
async function ask(text){
  if(!text.trim()) return;
  addMsg("user", escapeHtml(text));
  q.value = "";
  const typing = addMsg("bot", '<span class="typing"><span class="typing-dot">●</span><span class="typing-dot">●</span><span class="typing-dot">●</span></span>');
  sendBtn.disabled = true;
  try{
    const res = await fetch("/chat", {
      method:"POST",
      headers:{"Content-Type":"application/json","X-API-Key":API_KEY},
      body: JSON.stringify({question:text})
    });
    const data = await res.json();
    if(!res.ok){
      typing.querySelector(".bubble").innerHTML = `<span class="err">请求失败：${escapeHtml(data.error?.message || res.status)}</span>`;
      return;
    }
    const cites = data.citations || [];
    const answer = data.answer || JSON.stringify(data);
    const meta = data.model ? `模型 ${data.model} · 延迟 ${data.latency_ms}ms` : "";
    typing.querySelector(".bubble").innerHTML = escapeHtml(answer);
    if(cites.length){
      let c = typing.querySelector(".cites");
      if(!c){ c = document.createElement("div"); c.className="cites"; typing.querySelector("div:last-child").appendChild(c);}
      c.innerHTML = `📚 参考来源：<b>${cites.map(c=>c.title).join("、")}</b>`;
    }
    if(meta){ let mm = typing.querySelector(".meta"); if(!mm){ mm=document.createElement("div"); mm.className="meta"; typing.querySelector("div:last-child").appendChild(mm);} mm.textContent = meta; }
    // 追加反馈按钮
    if(cites.length){
      const fbWrap = typing.querySelector(".fb");
      if(!fbWrap){
        const div = document.createElement("div");
        div.className = "fb";
        div.dataset.q = encodeURIComponent(text);
        div.dataset.a = encodeURIComponent(answer);
        div.dataset.cites = encodeURIComponent(JSON.stringify(cites));
        div.innerHTML = `<button class="fb-up">👍 有用</button><button class="fb-down">👎 有误</button><span class="fb-msg"></span>`;
        typing.querySelector("div:last-child").appendChild(div);
      }
    }
    // 记录历史
    history.push({role:"user", text:text});
    history.push({role:"bot", text:answer, cites:cites, meta:meta});
    saveHistory();
  }catch(e){
    typing.querySelector(".bubble").innerHTML = `<span class="err">网络错误：${escapeHtml(e.message)}</span>`;
  }finally{
    sendBtn.disabled = false;
    q.focus();
  }
}

sendBtn.onclick = ()=> ask(q.value);
q.addEventListener("keydown", e=>{ if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); ask(q.value);} });
document.getElementById("chips").addEventListener("click", e=>{
  if(e.target.classList.contains("chip")) ask(e.target.textContent);
});
document.getElementById("clearBtn").onclick = ()=>{
  history = [];
  saveHistory();
  log.innerHTML = "";
  addMsg("bot", "你好，我是演示品牌 AI 知识助手。试试下面的问题，或随便问点什么 👇", null);
};

// ---------- 恢复历史 ----------
if(history.length === 0){
  addMsg("bot", "你好，我是演示品牌 AI 知识助手。试试下面的问题，或随便问点什么 👇", null, "检索增强生成 · 回答均附资料来源");
}else{
  for(const item of history){
    if(item.role === "user"){
      addMsg("user", escapeHtml(item.text));
    }else{
      addMsg("bot", escapeHtml(item.text), {cites:item.cites, meta:item.meta, question:item.text, answer:item.text});
    }
  }
}
</script>
</body>
</html>
