# hunkon_rag · Kubernetes Secret 模板
# 复制为 secret.yaml 并填入真实值（base64 编码），不要提交真实密钥到仓库。
# 生成强随机密钥（勿使用任何可预测的示例值）：
#   python -c "import secrets,base64;print(base64.b64encode(secrets.token_urlsafe(32).encode()).decode())"
# 或：
#   openssl rand -base64 32
apiVersion: v1
kind: Secret
metadata:
  name: hunkon-rag-secret
type: Opaque
data:
  # base64 编码的全局鉴权 Key（对应 RAG_API_KEY），部署前替换为上面生成的随机值
  api-key: "<REPLACE_WITH_BASE64_OF_RANDOM_KEY>"
  # base64 编码的 LLM API Key（对应 RAG_LLM_API_KEY），生产必填
  llm-api-key: "<REPLACE_WITH_BASE64_OF_LLM_KEY>"